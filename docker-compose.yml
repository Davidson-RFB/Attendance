# Local development environment only. Not used in production (see
# docs/DOTNET10_MIGRATION_PLAN.md - production deploys the same image built
# here to Azure Web App for Containers, against the real SQL Server, over
# SQL Authentication).

services:
  web:
    build:
      context: .
      dockerfile: DavidsonRFB.Attendance.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Matches the throwaway 'db' service credentials below.
      - ConnectionStrings__AttendanceContext=Server=db;Database=Attendance;User Id=sa;Password=LocalDev_Passw0rd!;TrustServerCertificate=True
    depends_on:
      db:
        condition: service_healthy

  # Disposable local SQL Server instance. Schema is seeded from
  # db/seed/ (added in Phase 1) to match production schema exactly - this
  # container holds no real data and can be wiped at any time.
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=LocalDev_Passw0rd!
    ports:
      - "1433:1433"
    volumes:
      - attendance-db-data:/var/opt/mssql
      # - ./db/seed:/docker-entrypoint-initdb.d  # wired up in Phase 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  attendance-db-data:
