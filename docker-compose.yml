# Local development environment only. Not used in production (see
# docs/DOTNET10_MIGRATION_PLAN.md - production deploys the same image built
# here to Azure Web App for Containers, against the real SQL Server, over
# SQL Authentication).

services:
  web:
    build:
      context: .
      dockerfile: DavidsonRFB.Attendance.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Matches the throwaway 'db' service credentials below.
      - ConnectionStrings__AttendanceContext=Server=db;Database=Attendance;User Id=sa;Password=LocalDev_Passw0rd!;TrustServerCertificate=True
      # Overrides appsettings.Development.json's local-folder default so the
      # Kiosk cookie's Data Protection keys survive `docker compose restart`/
      # rebuilds of the web container (not just process restarts).
      - DataProtection__KeyRingPath=/keys
      # Dummy values so Microsoft.Identity.Web can start up (constructs the
      # AAD authorize-endpoint URL etc.) without a real tenant registered yet.
      # Replace with real values via .env / a real appsettings override to
      # actually complete a sign-in - see Phase 8.
      - AzureAd__TenantId=00000000-0000-0000-0000-000000000000
      - AzureAd__ClientId=00000000-0000-0000-0000-000000000000
    volumes:
      - attendance-dataprotection-keys:/keys
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Disposable local SQL Server instance. Schema/data is seeded by db-init
  # from db/seed/*.sql - this container holds no real data and can be wiped
  # at any time (docker compose down -v).
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=LocalDev_Passw0rd!
    ports:
      - "1433:1433"
    volumes:
      - attendance-db-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: waits for 'db', creates the Attendance database if missing, and
  # applies db/seed/*.sql in order (mssql/server has no built-in
  # docker-entrypoint-initdb.d support, unlike postgres/mysql images).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=LocalDev_Passw0rd!
    volumes:
      - ./db/seed:/seed:ro
      - ./db/init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]

volumes:
  attendance-db-data:
  attendance-dataprotection-keys:
